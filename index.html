<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STEM Simulations &amp; Diagrams</title>
    <meta
      name="description"
      content="Interactive simulations and schema-driven diagrams we build for the STEM classroom."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8fafd;
        --surface: #ffffff;
        --tile: #f2f6fb;
        --line: #e4eaf3;
        --text: #26303f;
        --muted: #71809a;
        --accent: #3b8fef;
        --accent-strong: #2c7ad9;
        --radius: 16px;
        --font: "Mitr", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-weight: 300;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 24px;
      }

      header {
        padding: 46px 0 30px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      h1 {
        font-weight: 600;
        font-size: clamp(1.9rem, 5vw, 2.6rem);
        line-height: 1.25;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
      }

      .lede {
        font-size: 1rem;
        color: var(--muted);
        max-width: 52ch;
        margin: 0;
      }

      main.wrap {
        padding-top: 34px;
        padding-bottom: 72px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 22px;
      }

      /* ---------- cards ---------- */
      .card {
        display: flex;
        flex-direction: column;
        font: inherit;
        text-align: left;
        padding: 0 0 4px;
        width: 100%;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        color: inherit;
        box-shadow: 0 1px 2px rgba(38, 48, 63, 0.04);
        transition: transform 0.18s ease, border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .card:hover,
      .card:focus-visible {
        transform: translateY(-3px);
        border-color: var(--accent);
        box-shadow: 0 10px 24px rgba(59, 143, 239, 0.18);
        outline: none;
      }

      .card:focus-visible {
        box-shadow: 0 0 0 4px rgba(59, 143, 239, 0.25);
      }

      /* screenshot sits in a rounded tile, like the lesson thumbnails */
      .thumb {
        position: relative;
        display: block;
        margin: 10px 10px 0;
        aspect-ratio: 16 / 10;
        background: var(--tile);
        border-radius: 12px;
        overflow: hidden;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0;
        background: rgba(248, 250, 253, 0.55);
        transition: opacity 0.18s ease;
      }

      .play span {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--accent);
        color: #ffffff;
        display: grid;
        place-items: center;
        font-size: 1.05rem;
        padding-left: 4px;
        box-shadow: 0 6px 16px rgba(44, 122, 217, 0.4);
      }

      .card:hover .play,
      .card:focus-visible .play {
        opacity: 1;
      }

      .body {
        display: block;
        padding: 14px 18px 16px;
      }

      .title {
        display: block;
        font-weight: 500;
        font-size: 1.02rem;
        line-height: 1.4;
        margin-bottom: 4px;
      }

      .desc {
        display: block;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.55;
      }

      /* ---------- simulation panel ---------- */
      .player {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(12px, 4.5vmin, 56px);
        background: rgba(38, 48, 63, 0.45);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        animation: backdrop-in 0.16s ease-out;
      }

      .player[hidden] {
        display: none;
      }

      .player-panel {
        display: flex;
        flex-direction: column;
        width: min(100%, 1500px);
        height: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(38, 48, 63, 0.28);
        animation: panel-in 0.2s ease-out;
      }

      @keyframes backdrop-in {
        from {
          opacity: 0;
        }
      }

      @keyframes panel-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.985);
        }
      }

      .player-bar {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 16px;
        padding: 10px 12px 10px 18px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .player-bar .name {
        font-weight: 500;
        font-size: 0.98rem;
        margin-right: auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-bar button {
        font: inherit;
        font-weight: 400;
        font-size: 0.86rem;
        color: #ffffff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 7px 18px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.16s ease;
      }

      .player-bar button:hover {
        background: var(--accent-strong);
      }

      .player iframe {
        flex: 1;
        min-height: 0;
        width: 100%;
        border: 0;
        background: #fff;
      }

      /* ---------- tabs ---------- */
      .tabs {
        display: flex;
        margin-top: 22px;
        margin-bottom: -31px;
      }

      .tab {
        font: inherit;
        font-size: 0.94rem;
        color: var(--muted);
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 8px 4px 10px;
        margin-right: 22px;
        cursor: pointer;
        transition: color 0.16s ease, border-color 0.16s ease;
      }

      .tab:hover {
        color: var(--text);
      }

      .tab[aria-selected="true"] {
        color: var(--accent-strong);
        border-bottom-color: var(--accent);
        font-weight: 500;
      }

      /* ---------- diagram gallery ---------- */
      .group-head {
        font-weight: 500;
        font-size: 1.05rem;
        margin: 34px 0 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }

      .group-head:first-child {
        margin-top: 0;
      }

      .intro {
        max-width: 68ch;
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 0.94rem;
      }

      .intro:last-of-type {
        margin-bottom: 30px;
      }

      .intro strong {
        color: var(--text);
        font-weight: 500;
      }

      .group-head .count {
        color: var(--muted);
        font-weight: 300;
        font-size: 0.86rem;
        margin-left: 8px;
      }

      /* diagrams are line art on white, so show the whole sheet, not a crop */
      .thumb.sheet {
        background: #ffffff;
        border: 1px solid var(--line);
      }

      .thumb.sheet img {
        object-fit: contain;
        padding: 8px;
      }

      .status {
        color: var(--muted);
        font-size: 0.9rem;
      }

      /* the panel shows either a simulation (iframe) or a diagram (editor + render) */
      .player-media {
        flex: 1;
        min-height: 0;
        width: 100%;
        object-fit: contain;
        background: #fff;
        padding: 18px;
      }

      /* what the tool draws, under the panel's title bar */
      .player-note {
        padding: 10px 18px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.84rem;
        line-height: 1.55;
      }

      .player-note[hidden] {
        display: none;
      }

      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        background: #fff;
      }

      .stage[hidden] {
        display: none;
      }

      .editor {
        display: flex;
        flex-direction: column;
        width: 40%;
        min-width: 0;
        border-right: 1px solid var(--line);
      }

      .editor-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 0.7rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .editor-bar button {
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      .editor-bar button:hover {
        color: var(--text);
      }

      .editor textarea {
        flex: 1;
        min-height: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.78rem;
        line-height: 1.6;
        color: var(--text);
        background: #fff;
        border: 0;
        padding: 14px;
        resize: none;
        outline: none;
        tab-size: 2;
      }

      .editor-error {
        padding: 9px 14px;
        border-bottom: 1px solid #f2d4d6;
        background: #fdf0f1;
        color: #b03039;
        font-size: 0.78rem;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .editor-error[hidden] {
        display: none;
      }

      .render {
        flex: 1;
        min-width: 0;
        display: grid;
        place-items: center;
        overflow: auto;
        padding: 20px;
      }

      .render svg,
      .render img {
        max-width: 100%;
        height: auto;
      }

      @media (max-width: 820px) {
        .stage {
          flex-direction: column;
        }

        .editor {
          width: 100%;
          height: 45%;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="wrap">
        <h1>STEM Simulations &amp; Diagrams</h1>
        <p class="lede">
          A sample of the simulations and diagrams we build for the classroom.
        </p>
        <div class="tabs" role="tablist">
          <button class="tab" type="button" role="tab" id="tab-sims" aria-controls="panel-sims" aria-selected="true">Simulations</button>
          <button class="tab" type="button" role="tab" id="tab-diagrams" aria-controls="panel-diagrams" aria-selected="false">Diagrams</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section id="panel-sims" role="tabpanel" aria-labelledby="tab-sims">
      <div class="grid">
        <button class="card" type="button" data-sim="https://shayanin-van.github.io/dc-motor/dist/#bett">
          <span class="thumb">
            <img src="showcase/dc-motor.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">DC Motor</span>
            <span class="desc">Show the right hands, the force on the coil, the field.</span>
          </span>
        </button>

        <button class="card" type="button" data-sim="https://shayanin-van.github.io/bett-sim/mirror-and-lens/">
          <span class="thumb">
            <img src="showcase/mirror-and-lens.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">Mirrors &amp; Lenses</span>
            <span class="desc">Chain mirrors and lenses; the ray diagram follows.</span>
          </span>
        </button>

        <button class="card" type="button" data-sim="https://shayanin-van.github.io/motion-graphs/dist/">
          <span class="thumb">
            <img src="showcase/motion-graphs.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">1D Motion Graphs</span>
            <span class="desc">Adjust the graph and the UFO moves to match.</span>
          </span>
        </button>

        <button class="card" type="button" data-sim="https://shayanin-van.github.io/bett-sim/wave-interference/">
          <span class="thumb">
            <img src="showcase/wave-interference.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">Wave Interference</span>
            <span class="desc">Set two waves and watch them add and cancel.</span>
          </span>
        </button>

        <button class="card" type="button" data-sim="https://shayanin-van.github.io/shm-and-circular/dist/#bett">
          <span class="thumb">
            <img src="showcase/shm-and-circular.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">SHM &amp; Circular Motion</span>
            <span class="desc">Circular motion and an oscillation, kept in step.</span>
          </span>
        </button>

        <button class="card" type="button" data-sim="https://shayanin-van.github.io/bett-sim/natural-frequency/">
          <span class="thumb">
            <img src="showcase/natural-frequency.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">Natural Frequency &amp; Resonance</span>
            <span class="desc">Tune the spring, drive it with wind, find resonance.</span>
          </span>
        </button>

        <button class="card" type="button" data-sim="https://shayanin-van.github.io/bett-sim/right-hand-rule-straight-wire/dist/">
          <span class="thumb">
            <img src="showcase/rhr-straight.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">Right-Hand Rule &mdash; Straight Wire</span>
            <span class="desc">Flip the current, see which way the field turns around the wire.</span>
          </span>
        </button>

        <button class="card" type="button" data-sim="https://shayanin-van.github.io/newton-cannon-on-kai-planet/dist/">
          <span class="thumb">
            <img src="showcase/newton-cannonball.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">Newton&rsquo;s Cannonball</span>
            <span class="desc">Fire the cannon over a planet small enough to see the curve.</span>
          </span>
        </button>

        <button class="card" type="button" data-sim="https://shayanin-van.github.io/bett-sim/light-refrac-2/">
          <span class="thumb">
            <img src="showcase/light-refrac-2.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">Refraction &mdash; Air to Glass</span>
            <span class="desc">Drag the laser and watch the beam bend at the boundary.</span>
          </span>
        </button>

        <button class="card" type="button" data-sim="https://shayanin-van.github.io/bett-sim/current-in-field/">
          <span class="thumb">
            <img src="showcase/current-in-field.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">Current in a Magnetic Field</span>
            <span class="desc">Close the switch and the wire between the magnets moves.</span>
          </span>
        </button>

        <button class="card" type="button" data-sim="https://shayanin-van.github.io/bett-sim/right-hand-rule-circular-wire/dist/">
          <span class="thumb">
            <img src="showcase/rhr-circular.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">Right-Hand Rule &mdash; Circular Wire</span>
            <span class="desc">Flip the current, see which way the field points through the loop.</span>
          </span>
        </button>
        <button class="card" type="button" data-sim="https://shayanin-van.github.io/bett-sim/laser-double-slit/">
          <span class="thumb">
            <img src="showcase/laser-double-slit.webp" alt="" loading="lazy" width="960" height="600" />
            <span class="play"><span>&#9654;</span></span>
          </span>
          <span class="body">
            <span class="title">Laser &amp; Double Slit</span>
            <span class="desc">Move the slits and the screen; the fringes respond.</span>
          </span>
        </button>
      </div>
      </section>

      <section id="panel-diagrams" role="tabpanel" aria-labelledby="tab-diagrams" hidden>
        <p class="status">Loading diagrams&hellip;</p>
      </section>
    </main>

    <div class="player" id="player" hidden>
      <div class="player-panel" role="dialog" aria-modal="true" aria-label="Simulation">
        <div class="player-bar">
          <span class="name" id="player-name"></span>
          <button type="button" id="player-close">Close &#10005;</button>
        </div>
        <iframe id="player-frame" class="player-media" title="Simulation" allow="fullscreen; xr-spatial-tracking"></iframe>
        <p class="player-note" id="player-note" hidden></p>
        <div class="stage" id="player-stage" hidden>
          <div class="editor">
            <div class="editor-bar">
              <span>JSON parameters</span>
              <button type="button" id="editor-reset">Reset</button>
            </div>
            <p class="editor-error" id="editor-error" hidden></p>
            <textarea id="editor-json" spellcheck="false" aria-label="Diagram JSON"></textarea>
          </div>
          <div class="render" id="render-target"></div>
        </div>
      </div>
    </div>

    <script src="diagrams/index.js"></script>
    <script src="vendor/en-labels.js"></script>
    <script>
      (function () {
        var player = document.getElementById("player");
        var frame = document.getElementById("player-frame");
        var name = document.getElementById("player-name");
        var closeBtn = document.getElementById("player-close");
        var stage = document.getElementById("player-stage");
        var editor = document.getElementById("editor-json");
        var editorError = document.getElementById("editor-error");
        var target = document.getElementById("render-target");
        var note = document.getElementById("player-note");
        var lastFocus = null;

        function openPanel(label) {
          lastFocus = document.activeElement;
          name.textContent = label;
          player.hidden = false;
          document.body.style.overflow = "hidden";
          closeBtn.focus();
        }

        function openSim(src, label) {
          frame.hidden = false;
          stage.hidden = true;
          note.hidden = true;
          frame.title = label;
          frame.src = src;
          openPanel(label);
        }

        function closeSim() {
          player.hidden = true;
          frame.removeAttribute("src"); // stop the simulation rendering
          target.innerHTML = "";
          document.body.style.overflow = "";
          if (lastFocus) lastFocus.focus();
        }

        // delegated: simulation cards are in the markup, diagram cards are built on demand
        document.addEventListener("click", function (e) {
          var card = e.target.closest("[data-sim], [data-diagram]");
          if (!card) return;
          var label = card.querySelector(".title").textContent;
          if (card.dataset.sim) openSim(card.dataset.sim, label);
          else openDiagram(diagrams[card.dataset.diagram], label);
        });

        // ---------- tabs ----------
        var tabs = [
          [document.getElementById("tab-sims"), document.getElementById("panel-sims")],
          [document.getElementById("tab-diagrams"), document.getElementById("panel-diagrams")],
        ];
        tabs.forEach(function (pair) {
          pair[0].addEventListener("click", function () {
            tabs.forEach(function (other) {
              var active = other === pair;
              other[0].setAttribute("aria-selected", String(active));
              other[1].hidden = !active;
            });
            if (pair[0].id === "tab-diagrams") loadDiagrams();
          });
        });

        // ---------- diagram gallery ----------
        // window.DIAGRAM_INDEX (diagrams/index.js) and the thumbnails are written by
        // scripts/export-diagrams.mjs from @skooldio/skooldio-lams-markdown's showcase.
        var diagrams = {};
        (window.DIAGRAM_INDEX || []).forEach(function (d) {
          diagrams[d.key] = d;
        });
        var diagramsLoaded = false;

        function esc(s) {
          return String(s).replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }

        var INTRO =
          '<p class="intro">Every figure below is drawn from a JSON object, not generated as ' +
          'pixels. Each tool publishes a <strong>constraint schema</strong> describing exactly ' +
          'what it can draw, so a language model states the figure it wants &mdash; the values, ' +
          'the labels, the arrows &mdash; and a renderer draws precisely that.</p>' +
          '<p class="intro">Ask an image model for the same diagram and you get one that is ' +
          '<strong>almost right</strong>: an axis mislabelled, a value invented, an arrow ' +
          'pointing the wrong way. Almost right is no use in teaching material. This is how we ' +
          'let an LLM write academic content whose diagrams are correct. Open one and edit the ' +
          'JSON to watch it redraw.</p>';

        function diagramsMarkup(items) {
          var counts = {};
          items.forEach(function (d) {
            counts[d.groupLabel] = (counts[d.groupLabel] || 0) + 1;
          });
          var html = "";
          var group = null;
          items.forEach(function (d) {
            if (d.groupLabel !== group) {
              if (group !== null) html += "</div>";
              group = d.groupLabel;
              html +=
                '<h2 class="group-head">' +
                esc(group) +
                '<span class="count">' +
                counts[group] +
                "</span></h2>" +
                '<div class="grid">';
            }
            html +=
              '<button class="card" type="button" data-diagram="' + esc(d.key) + '">' +
              '<span class="thumb sheet"><img src="diagrams/' + esc(d.file) +
              '" alt="" loading="lazy" /></span>' +
              '<span class="body"><span class="title">' + esc(d.displayName) + "</span>" +
              '<span class="desc">' + esc(d.title) + "</span></span></button>";
          });
          return group === null ? "" : html + "</div>";
        }

        function loadDiagrams() {
          if (diagramsLoaded) return;
          diagramsLoaded = true;
          var panel = document.getElementById("panel-diagrams");
          var items = window.DIAGRAM_INDEX || [];
          panel.innerHTML = items.length
            ? INTRO + diagramsMarkup(items)
            : '<p class="status">No diagrams yet &mdash; run scripts/export-diagrams.mjs.</p>';
        }

        // ---------- live diagram: edit the JSON, the render follows ----------
        // vendor/lams-diagram.js is 3 MB, so it is fetched the first time a diagram is opened,
        // not on page load. Until it arrives (or if it fails) the exported PNG stands in.
        var toolsPromise = null;
        var current = null;
        var debounce = null;

        function loadTools() {
          if (toolsPromise) return toolsPromise;
          toolsPromise = new Promise(function (resolve, reject) {
            if (window.LAMS_TOOLS) return resolve(window.LAMS_TOOLS);
            var tag = document.createElement("script");
            tag.src = "vendor/lams-diagram.js";
            tag.onload = function () {
              window.LAMS_TOOLS ? resolve(window.LAMS_TOOLS) : reject(new Error("no registry"));
            };
            tag.onerror = function () {
              reject(new Error("could not load vendor/lams-diagram.js"));
            };
            document.head.appendChild(tag);
          });
          return toolsPromise;
        }

        function stillImage(d) {
          target.innerHTML =
            '<img src="diagrams/' + esc(d.file) + '" alt="' + esc(d.displayName) + '" />';
        }

        function openDiagram(d, label) {
          current = d;
          editor.value = JSON.stringify({ name: d.name, parameters: d.params }, null, 2);
          editorError.hidden = true;
          note.textContent = d.summary || "";
          note.hidden = !d.summary;
          stage.hidden = false;
          frame.hidden = true;
          stillImage(d); // placeholder while the renderer loads
          openPanel(label);
          renderJson();
        }

        function renderJson() {
          var d = current;
          var spec;
          try {
            spec = JSON.parse(editor.value);
          } catch (err) {
            editorError.hidden = false;
            editorError.textContent = err.message;
            return;
          }
          editorError.hidden = true;
          loadTools()
            .then(function (tools) {
              if (current !== d) return; // panel moved on while the bundle was loading
              var tool =
                tools[d.key] ||
                Object.keys(tools)
                  .map(function (k) {
                    return tools[k];
                  })
                  .find(function (t) {
                    return t.declaration.name === spec.name;
                  });
              if (!tool) throw new Error('unknown diagram tool "' + spec.name + '"');
              target.innerHTML = "";
              return Promise.resolve(tool.render(target, spec.parameters || {})).then(
                function () {
                  // some renderers caption in Thai; the exported PNGs get the same swap
                  if (window.toEnglish) window.toEnglish(target);
                },
              );
            })
            .catch(function (err) {
              if (current !== d) return;
              editorError.hidden = false;
              editorError.textContent = String(err && err.message ? err.message : err);
              stillImage(d); // fall back to the exported image
            });
        }

        editor.addEventListener("input", function () {
          clearTimeout(debounce);
          debounce = setTimeout(renderJson, 400);
        });

        document.getElementById("editor-reset").addEventListener("click", function () {
          if (!current) return;
          editor.value = JSON.stringify(
            { name: current.name, parameters: current.params },
            null,
            2,
          );
          renderJson();
        });

        closeBtn.addEventListener("click", closeSim);
        player.addEventListener("click", function (e) {
          if (e.target === player) closeSim(); // the dimmed area around the panel
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && !player.hidden) closeSim();
        });
      })();
    </script>
  </body>
</html>
