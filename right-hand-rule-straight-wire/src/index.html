<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Right-Hand Rule: Straight Wire</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Mitr"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas class="webgl"></canvas>
    <script type="module" src="./script.js"></script>
    <div id="control">
      <button id="onoff" onclick="onoffClick()">on</button>
      <button id="dir" onclick="dirClick()">↓</button>
    </div>
    <script>
      var isOn = false;
      var isDown = true;
      const onoffClick = () => {
        isOn = !isOn;
        if (isOn) {
          document.getElementById("onoff").style.color = "rgb(128, 196, 255)";
          document.getElementById("dir").style.color = "rgb(128, 196, 255)";
        } else {
          document.getElementById("onoff").style.color =
            "rgba(63, 63, 63, 0.5)";
          document.getElementById("dir").style.color = "rgba(63, 63, 63, 0.5)";
        }
      };
      const dirClick = () => {
        isDown = !isDown;
        if (isDown) {
          document.getElementById("dir").innerText = "↓";
        } else {
          document.getElementById("dir").innerText = "↑";
        }
      };

      // initialize on current
      onoffClick();
    </script>
    <div class="note">
      <p>Try rotating the view</p>
    </div>
  </body>
</html>
